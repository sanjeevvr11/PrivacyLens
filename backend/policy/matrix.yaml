# Policy matrix: finding type x intent -> action (KEEP | WARN | REMOVE).
#
# Missing cells default conservative (WARN) in engine.py, never KEEP.
# legal_hold is additionally forced to KEEP in code — a mistyped cell here must not
# be able to cause spoliation. The KEEP values under legal_hold are belt-and-braces.

GPS_COORDINATES:
  job_application: REMOVE
  public_sharing: REMOVE
  internal_sharing: WARN
  legal_hold: KEEP

EXIF_THUMBNAIL:
  job_application: REMOVE
  public_sharing: REMOVE
  internal_sharing: WARN
  legal_hold: KEEP

COVERED_TEXT:            # a leak by construction — remove everywhere removal is allowed
  job_application: REMOVE
  public_sharing: REMOVE
  internal_sharing: REMOVE
  legal_hold: KEEP

COMMENT:
  job_application: REMOVE
  public_sharing: REMOVE
  internal_sharing: WARN
  legal_hold: KEEP

REVISION_AUTHOR:
  job_application: REMOVE
  public_sharing: REMOVE
  internal_sharing: WARN
  legal_hold: KEEP

SOFTWARE_FINGERPRINT:
  job_application: WARN
  public_sharing: REMOVE
  internal_sharing: KEEP
  legal_hold: KEEP

HIDDEN_TEXT:             # tracked changes / ins-del
  job_application: REMOVE
  public_sharing: REMOVE
  internal_sharing: WARN
  legal_hold: KEEP

EMBEDDED_OBJECT:
  job_application: WARN
  public_sharing: REMOVE
  internal_sharing: WARN
  legal_hold: KEEP

JAVASCRIPT:              # active content — a risk wherever removal is allowed
  job_application: REMOVE
  public_sharing: REMOVE
  internal_sharing: REMOVE
  legal_hold: KEEP

FORM_FIELD:
  job_application: WARN
  public_sharing: REMOVE
  internal_sharing: WARN
  legal_hold: KEEP

CUSTOM_PROPERTY:
  job_application: WARN
  public_sharing: REMOVE
  internal_sharing: KEEP
  legal_hold: KEEP

EMBEDDED_IMAGE:          # flagged, never auto-removed — the tool can't know a photo is private
  job_application: WARN
  public_sharing: WARN
  internal_sharing: WARN
  legal_hold: KEEP

USER_SPECIFIED:          # the user explicitly asked for this — always remove
  job_application: REMOVE
  public_sharing: REMOVE
  internal_sharing: REMOVE
  legal_hold: KEEP       # legal hold still blocks (engine also clamps in code)

EMAIL:                   # legitimately kept for a recruiter; risky in public
  job_application: KEEP
  public_sharing: WARN
  internal_sharing: KEEP
  legal_hold: KEEP

PHONE:
  job_application: KEEP
  public_sharing: WARN
  internal_sharing: KEEP
  legal_hold: KEEP

PERSON_NAME:
  job_application: KEEP
  public_sharing: WARN
  internal_sharing: KEEP
  legal_hold: KEEP

ADDRESS:
  job_application: WARN
  public_sharing: REMOVE
  internal_sharing: WARN
  legal_hold: KEEP

PAN:
  job_application: WARN
  public_sharing: REMOVE
  internal_sharing: WARN
  legal_hold: KEEP

AADHAAR:                 # national id — remove wherever allowed
  job_application: REMOVE
  public_sharing: REMOVE
  internal_sharing: REMOVE
  legal_hold: KEEP

CARD:                    # payment card — remove wherever allowed
  job_application: REMOVE
  public_sharing: REMOVE
  internal_sharing: REMOVE
  legal_hold: KEEP
